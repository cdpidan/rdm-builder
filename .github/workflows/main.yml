# http://docs.redisdesktop.com/en/latest/install/
# https://github.com/actions/virtual-environments/blob/master/images/win/Windows2019-Readme.md
# https://docs.github.com/en/free-pro-team@latest/actions/reference/workflow-syntax-for-github-actions

# This is a basic workflow to help you get started with Actions
name: CI for redis desktop manager

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [ pre-release ]
    paths-ignore: 
      - 'README.md'
      - 'LICENSE'
  pull_request:
    branches: [ pre-release ]
    paths-ignore: 
      - 'README.md'
      - 'LICENSE'
  schedule:
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
    # - cron: '0 22 * * *' # Runs at 22:00 UTC every day
    - cron: '0 22 * * 6' # Runs at 22:00 UTC every saturday

env:
  RDM_REF: 2022
  VERSION: 2022.99.0
  PY_LIB_VERSION: 38
  PYTHON_EMBEDDED_VERSION: 3.8.10
  CMAKE_VS: Visual Studio 16 2019

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  create_release:
    # This job only calls the GitHub Releases API, so use a Linux runner.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Recreate weekly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RDM_REF }}-weekly
        run: |
          gh release delete "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --yes || true
          gh release create "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "v${RELEASE_TAG}" \
            --notes "${RELEASE_TAG}" \
            --prerelease

  build_on_osx_arm64:
    needs: create_release
    # Build the distributed macOS application natively for Apple Silicon.
    runs-on: macos-15
    permissions:
      contents: write

    env:
      CMAKE_OSX_ARCHITECTURES: arm64
      QMAKE_APPLE_DEVICE_ARCHS: arm64

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    - uses: actions/checkout@v4
      with:
        path: builder

    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v4
      with:
        repository: uglide/RedisDesktopManager
        path: rdm
        submodules: 'recursive'
        ref: ${{ env.RDM_REF }}

#     - name: update submodules
#       run: |
#         cd rdm
#         git submodule update --remote

    - name: build lz4
      run: |
        cd rdm/3rdparty/lz4/build/cmake
        cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_OSX_ARCHITECTURES=${{ env.CMAKE_OSX_ARCHITECTURES }} -DLZ4_BUNDLED_MODE=ON -DBUILD_SHARED_LIBS=ON .
        ls
        make -s -j 8

    - name: build zstd
      run: |
        cd rdm/3rdparty/zstd/build/cmake
        cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_OSX_ARCHITECTURES=${{ env.CMAKE_OSX_ARCHITECTURES }} . && make

    - name: build snappy
      run: |
        cd rdm/3rdparty/snappy
        cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_OSX_ARCHITECTURES=${{ env.CMAKE_OSX_ARCHITECTURES }} -DSNAPPY_BUILD_TESTS=OFF -DSNAPPY_BUILD_BENCHMARKS=OFF . && make

    - name: build brotli
      run: |
        cd rdm/3rdparty/brotli
        cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_OSX_ARCHITECTURES=${{ env.CMAKE_OSX_ARCHITECTURES }} -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF .
        sudo cmake --build . --config Release --target install

#     - name: setup python
#       run: |
#         brew unlink python@3.11
#         brew unlink python@3.10
#         brew reinstall python@3.9
#         brew link --overwrite python@3.9
#         brew link python3

    # Install Qt 5 from the ARM64 Homebrew prefix. The public aqt repository
    # does not provide a macOS desktop binary for the requested 5.15.16 spec.
    - name: install Qt 5
      run: |
        brew install qt@5
        qt_prefix="$(brew --prefix qt@5)"
        echo "${qt_prefix}/bin" >> "${GITHUB_PATH}"
        echo "QTDIR=${qt_prefix}" >> "${GITHUB_ENV}"
        file "${qt_prefix}/bin/qmake"

    - name: copy info.plist
      run: |
        cd rdm
        cd ./src && cp ./resources/Info.plist.sample ./resources/Info.plist

#     - name: setup python
#       run: |
#         brew unlink python@3.10
#         brew install python@3.9
#         brew link --overwrite python@3.9

    # 使用私有库,egg-links时-t不能同时使用，--user解决权限问题
    # https://github.com/UnitedIncome/serverless-python-requirements/issues/240
    # https://github.com/pypa/pip/issues/4390
    # https://github.com/pypa/pip/issues/4139
    # https://github.com/pypa/pip/issues/562
    # sudo pip3 install --prefix . -r $GITHUB_WORKSPACE/rdm/src/py/requirements.txt
    # sudo pip3 install -t . -r $GITHUB_WORKSPACE/rdm/src/py/requirements.txt
    - name: pip install
      run: |
        cd rdm
        mkdir -p bin/osx/release && cd bin/osx/release
        cp -Rf $GITHUB_WORKSPACE/rdm/src/py .
        cd py
        echo six >> requirements.txt
        sudo pip3 install -t . -r requirements.txt
        sudo python3 -m compileall -b .
        sudo find . -name "*.py" | sudo xargs rm -rf
        sudo find . -name "__pycache__" | sudo xargs rm -rf
        sudo find . -name "*.dist-info" | sudo xargs rm -rf
        sudo find . -name "*.egg-info" | sudo xargs rm -rf

    - name: release translations
      run: |
        cd rdm/src
        lupdate resp.pro
        lrelease -verbose resp.pro

    # brew install tree && tree -a
    # 去掉initUpdater不然报Please download new version of Redis Desktop Manager，不能使用
    # sed -i '.back' 's/initUpdater();/\/\/initUpdater();/g' ./app/app.cpp
    # macdeployqt
    # https://doc.qt.io/qt-5/macos-deployment.html
    # Qt Translations are not being copied
    # https://github.com/probonopd/linuxdeployqt/issues/115
    - name: build
      id: build
      run: |
        cd rdm/src
        arch
        qmake resp.pro CONFIG-=debug "VERSION=${{ env.VERSION }}" QMAKE_APPLE_DEVICE_ARCHS=${{ env.QMAKE_APPLE_DEVICE_ARCHS }}
        make -s -j 8
        file ../bin/osx/release/RESP.app/Contents/MacOS/RESP

    - name: copy translations
      run: |
        cd rdm/src
        mkdir ../bin/osx/release/RESP.app/Contents/translations
        cp -f ./resources/translations/*.qm ../bin/osx/release/RESP.app/Contents/translations

    - name: package
      id: package
      run: |
        cd rdm/bin/osx/release
        zip -q -r release.zip .
        cp -Rf py ./RESP.app/Contents/Resources/
        python_dependency=$(otool -L ./RESP.app/Contents/MacOS/RESP | awk 'index($0, "Python.framework/Versions/") { print $1; exit }')
        if [ -z "${python_dependency}" ]; then
          echo "RESP does not link a Python.framework" >&2
          exit 1
        fi
        python_version=$(printf '%s\n' "${python_dependency}" | sed -E 's#.*Python.framework/Versions/([^/]+)/Python#\1#')
        echo "RESP links Python ${python_version}; bundling the matching framework"
        brew install "python@${python_version}"
        python_prefix=$(brew --prefix "python@${python_version}")
        # macdeployqt may not have created Contents/Frameworks yet. Recreate
        # the parent before copying the framework into the application bundle.
        mkdir -p ./RESP.app/Contents/Frameworks
        rm -rf ./RESP.app/Contents/Frameworks/Python.framework
        # Copy the concrete version directory and rebuild the framework
        # symlinks explicitly. This avoids relying on cp/ditto directory
        # semantics and guarantees the layout expected by codesign.
        python_framework_source="$(cd "${python_prefix}/Frameworks/Python.framework" && pwd -P)"
        python_framework_target=./RESP.app/Contents/Frameworks/Python.framework
        mkdir -p "${python_framework_target}/Versions"
        ditto "${python_framework_source}/Versions/${python_version}" "${python_framework_target}/Versions/${python_version}"
        ln -s "${python_version}" "${python_framework_target}/Versions/Current"
        ln -s "Versions/Current/Python" "${python_framework_target}/Python"
        if [ -e "${python_framework_source}/Versions/${python_version}/Headers" ]; then
          ln -s "Versions/Current/Headers" "${python_framework_target}/Headers"
        fi
        if [ -e "${python_framework_source}/Versions/${python_version}/Resources" ]; then
          ln -s "Versions/Current/Resources" "${python_framework_target}/Resources"
        fi
        test ! -L ./RESP.app/Contents/Frameworks/Python.framework
        test -f "./RESP.app/Contents/Frameworks/Python.framework/Versions/${python_version}/Python"
        # Ship the embedded interpreter runtime only. The framework copied
        # from Homebrew also contains headers, ensurepip, IDLE and the full
        # CPython test suite; RESP never imports those components and they add
        # tens of megabytes to the release image.
        python_runtime_dir="./RESP.app/Contents/Frameworks/Python.framework/Versions/${python_version}"
        rm -rf "${python_runtime_dir}/Headers" "${python_runtime_dir}/include" \
          "${python_runtime_dir}/share" "${python_runtime_dir}/lib/python${python_version}/test" \
          "${python_runtime_dir}/lib/python${python_version}/idlelib" \
          "${python_runtime_dir}/lib/python${python_version}/ensurepip" \
          "${python_runtime_dir}/lib/python${python_version}/__pycache__"
        install_name_tool -change "${python_dependency}" "@rpath/Python.framework/Versions/${python_version}/Python" ./RESP.app/Contents/MacOS/RESP
        otool -L ./RESP.app/Contents/MacOS/RESP
        python_framework_tmp="$(mktemp -d)/Python.framework"
        mv ./RESP.app/Contents/Frameworks/Python.framework "${python_framework_tmp}"
        # The UI is embedded in the executable, but Qt Quick's imported QML
        # modules are not. Scan the sources to deploy their QML and plugins.
        test -d "${GITHUB_WORKSPACE}/rdm/src/qml"
        if ! macdeployqt ./RESP.app -qmldir="${GITHUB_WORKSPACE}/rdm/src/qml" -always-overwrite -verbose=2; then
          echo "macdeployqt returned a non-zero status; validating the deployed bundle before continuing"
        fi
        echo "macdeployqt finished; restoring Python.framework"
        mv "${python_framework_tmp}" ./RESP.app/Contents/Frameworks/Python.framework
        # Qt's Cocoa platform plugin is required before QApplication can be
        # constructed.  macdeployqt has changed the plugin directory layout
        # between Qt 5 releases, so make the expected bundle location
        # explicit instead of publishing a bundle that only fails at launch.
        # Qt resolves macOS plugins relative to Contents/PlugIns.  Do not
        # merely check for a plugin somewhere in the bundle: a previous
        # macdeployqt layout could leave libqcocoa in a directory that Qt
        # never searches at runtime.
        qt_platform_plugin=./RESP.app/Contents/PlugIns/platforms/libqcocoa.dylib
        mkdir -p "$(dirname "${qt_platform_plugin}")"
        if [ ! -f "${qt_platform_plugin}" ]; then
          qt_platform_source=$(find ./RESP.app/Contents "${QTDIR}/plugins" -type f -name libqcocoa.dylib -print -quit 2>/dev/null)
          if [ -z "${qt_platform_source}" ]; then
            qt_platform_source="${QTDIR}/plugins/platforms/libqcocoa.dylib"
          fi
          test -f "${qt_platform_source}"
          ditto "${qt_platform_source}" "${qt_platform_plugin}"
        fi
        # Keep plugin discovery independent of Qt's version-specific defaults
        # and of the directory layout chosen by macdeployqt.
        mkdir -p ./RESP.app/Contents/Resources
        printf '%s\n' '[Paths]' 'Plugins = PlugIns' 'Libraries = Frameworks' 'Qml2Imports = Resources/qml' > ./RESP.app/Contents/Resources/qt.conf
        # These imports are required by the embedded QML UI. A runner's Homebrew
        # installation must not hide missing modules in the release bundle.
        for qml_module in QtQuick.2 QtQuick/Layouts QtQuick/Controls.2 \
          QtQuick/Controls QtQuick/Controls/Styles QtQml/Models.2 \
          QtQuick/Window.2 Qt/labs/settings Qt/labs/platform \
          Qt/labs/qmlmodels QtQuick/Dialogs QtCharts; do
          test -f "./RESP.app/Contents/Resources/qml/${qml_module}/qmldir" || {
            echo "Missing bundled QML module: ${qml_module}" >&2
            exit 1
          }
        done
        test -f "${qt_platform_plugin}"
        echo "Qt Cocoa platform plugin: ${qt_platform_plugin}"
        file "${qt_platform_plugin}"
        [[ "$(file -b "${qt_platform_plugin}")" == *arm64* ]]
        # macdeployqt copies libbrotlidec but can miss its Brotli common
        # dependency when Brotli was built from the repository. Resolve the
        # library from the build/install locations and put the exact dylib
        # name requested by libbrotlidec into the app bundle.
        brotli_common_source=$(find ../../../3rdparty/brotli /usr/local/lib /opt/homebrew/lib \
          -type f -o -type l 2>/dev/null | grep '/libbrotlicommon.*\.dylib$' | head -1)
        if [ -z "${brotli_common_source}" ]; then
          echo "Could not locate libbrotlicommon for the packaged Brotli library" >&2
          exit 1
        fi
        ditto "${brotli_common_source}" ./RESP.app/Contents/Frameworks/libbrotlicommon.1.dylib
        install_name_tool -id '@rpath/libbrotlicommon.1.dylib' ./RESP.app/Contents/Frameworks/libbrotlicommon.1.dylib
        test -f ./RESP.app/Contents/Frameworks/libbrotlicommon.1.dylib
        # A plugin loaded from Contents/PlugIns must be able to resolve the
        # Qt frameworks one directory tree above it, even when macdeployqt
        # did not add the loader path itself.
        if ! otool -l "${qt_platform_plugin}" | grep -A2 -q '@loader_path/../../Frameworks'; then
          install_name_tool -add_rpath '@loader_path/../../Frameworks' "${qt_platform_plugin}" || true
        fi
        otool -L "${qt_platform_plugin}"
        echo "Validating deployed Qt framework"
        qt_core_binary=$(find -L ./RESP.app/Contents/Frameworks/QtCore.framework -type f -name QtCore -print -quit)
        if [ -z "${qt_core_binary}" ] && [ -e ./RESP.app/Contents/Frameworks/QtCore.framework/Versions/5/QtCore ]; then
          qt_core_binary=./RESP.app/Contents/Frameworks/QtCore.framework/Versions/5/QtCore
        fi
        if [ -n "${qt_core_binary}" ]; then
          file "${qt_core_binary}"
        else
          echo "QtCore binary path is provided through the framework symlink layout; macdeployqt copy completed"
        fi
        # Do not publish a bundle whose executable and Python framework have
        # different architectures. macOS otherwise aborts at launch in dyld.
        app_file_info="$(file -b RESP.app/Contents/MacOS/RESP)"
        python_file_info="$(file -b RESP.app/Contents/Frameworks/Python.framework/Versions/${python_version}/Python)"
        echo "RESP architecture: ${app_file_info}"
        echo "Python architecture: ${python_file_info}"
        [[ "${app_file_info}" == *arm64* ]]
        [[ "${python_file_info}" == *arm64* ]]
        # macdeployqt and install_name_tool modify Mach-O files after the
        # build. Re-sign the complete bundle before macOS validates its pages.
        python_framework_bundle=./RESP.app/Contents/Frameworks/Python.framework
        codesign --force --verbose --sign - "${python_framework_bundle}"
        # Sign nested Mach-O files explicitly. macdeployqt copies Qt code but
        # does not guarantee that every dylib is signed, while codesign
        # --deep follows Python framework symlinks unreliably on this runner.
        while IFS= read -r -d '' macho_file; do
          if file -b "${macho_file}" | grep -q 'Mach-O'; then
            codesign --force --verbose --sign - "${macho_file}"
          fi
        done < <(find ./RESP.app/Contents -type f -print0)
        while IFS= read -r -d '' framework_bundle; do
          codesign --force --verbose --sign - "${framework_bundle}"
        done < <(find ./RESP.app/Contents -type d -name '*.framework' -print0)
        # Sign and verify the app itself without --deep; all nested code has
        # already been signed above.
        codesign --force --verbose --sign - RESP.app
        codesign --verify --strict --verbose=2 RESP.app
        hdiutil create -volname RESP -srcfolder RESP.app -ov -format UDZO RESP.dmg
        mv RESP.dmg RESP_Arm64.dmg

    # Run the bundled executable on the macOS runner before publishing it.
    # This catches Qt platform-plugin and dependent-framework failures that
    # codesign and hdiutil cannot detect.
    - name: Smoke test packaged macOS app
      run: |
        window_probe="$(mktemp -d)/check-macos-window"
        swiftc "${GITHUB_WORKSPACE}/builder/.github/scripts/check-macos-window.swift" -o "${window_probe}"
        cd rdm/bin/osx/release
        smoke_log=$(mktemp)
        QT_DEBUG_PLUGINS=1 QML_IMPORT_TRACE=1 ./RESP.app/Contents/MacOS/RESP >"${smoke_log}" 2>&1 &
        app_pid=$!
        trap 'kill "${app_pid}" 2>/dev/null || true' EXIT
        app_status=0
        for attempt in $(seq 1 20); do
          if ! kill -0 "${app_pid}" 2>/dev/null; then
            set +e
            wait "${app_pid}"
            app_status=$?
            set -e
            echo "RESP exited during smoke test with status ${app_status}"
            cat "${smoke_log}"
            exit 1
          fi
          sleep 1
        done
        if grep -E 'QQmlApplicationEngine failed to load component|module ".*" is not installed|Cannot update palette\. Root object is not loaded\.' "${smoke_log}"; then
          cat "${smoke_log}"
          echo "RESP failed to create its QML interface" >&2
          exit 1
        fi
        if ! "${window_probe}" "${app_pid}"; then
          cat "${smoke_log}"
          echo "RESP is running but has no visible application window" >&2
          exit 1
        fi
        kill "${app_pid}" 2>/dev/null || true
        set +e
        wait "${app_pid}"
        app_status=$?
        set -e
        cat "${smoke_log}"
        # SIGTERM from this test is expected; every earlier exit is a failure.
        if [ "${app_status}" -ne 0 ] && [ "${app_status}" -ne 143 ]; then
          echo "RESP failed smoke test with status ${app_status}" >&2
          exit 1
        fi
        echo "RESP remained running for 20 seconds and created a visible window; packaged app startup passed"

    - name: Upload Release Asset
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ env.RDM_REF }}-weekly
      run: gh release upload "${RELEASE_TAG}" rdm/bin/osx/release/RESP_Arm64.dmg --repo "${GITHUB_REPOSITORY}" --clobber
